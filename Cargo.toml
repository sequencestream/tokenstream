[package]
name = "tokenstream"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bytes = "1.12.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.7"
zeroize = "1.8.2"

[dev-dependencies]
serde_json = "1.0.145"
