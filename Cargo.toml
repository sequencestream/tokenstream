[package]
name = "tokenstream"
version = "0.1.0"
edition = "2024"
publish = false

# Stripping build-time dylibs can misalign LINKEDIT on macOS with Rust 1.97.
[profile.release.build-override]
strip = "none"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"
bytes = "1.12.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
futures-util = { version = "0.3.31", features = ["sink"] }
getrandom = "0.2.17"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
include_dir = "0.7.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "sqlite"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tower-service = "0.3.3"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
url = "2.5.7"
zeroize = "1.8.2"

[dev-dependencies]
proc-macro2 = "=1.0.106"
syn = { version = "=2.0.119", features = ["full", "visit"] }
tempfile = "3.23.0"

